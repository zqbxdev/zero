# English: Build and push base/dev/full Docker image variants to Docker Hub when a release Git tag is pushed.
# 中文：当推送发布用 Git tag 时，构建并推送 base/dev/full 三种 Docker 镜像到 Docker Hub。
name: Build and Push Docker Images

# English: This workflow only runs for tag pushes, not for normal branch pushes.
# 中文：该工作流只在推送 tag 时触发，不会在普通分支 push 时触发。
on:
  push:
    tags:
      # English: Stable semantic version tags, for example v1.0.0.
      # 中文：稳定版语义化版本 tag，例如 v1.0.0。
      - "v*.*.*"
      # English: Pre-release semantic version tags, for example v1.0.0-beta.1.
      # 中文：预发布语义化版本 tag，例如 v1.0.0-beta.1。
      - "v*.*.*-*"

# English: The workflow only needs read access to repository contents.
# 中文：该工作流只需要读取仓库内容的权限。
permissions:
  contents: read

jobs:
  docker:
    # English: Build one Dockerfile target per image variant: base, dev, and full.
    # 中文：为 base、dev、full 三种镜像分别构建对应的 Dockerfile target。
    name: Build and push ${{ matrix.variant }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - base
          - dev
          - full

    steps:
      # English: Check out the repository source code for Docker build context.
      # 中文：检出仓库源代码，作为 Docker 构建上下文。
      - name: Checkout repository
        uses: actions/checkout@v4

      # English: Enable Docker Buildx for multi-target Docker builds and caching support.
      # 中文：启用 Docker Buildx，用于多 target Docker 构建和缓存能力。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # English: Log in to Docker Hub using repository secrets.
      # 中文：使用仓库 secrets 登录 Docker Hub。
      # English: Required secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
      # 中文：需要的 secrets：DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN。
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # English: Build the selected Dockerfile target and publish versioned plus latest variant tags.
      # 中文：构建当前选择的 Dockerfile target，并发布版本 tag 与 latest 变体 tag。
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # English: Use repository root as Docker build context.
          # 中文：使用仓库根目录作为 Docker 构建上下文。
          context: .
          # English: Build from the multi-stage Dockerfile in the repository root.
          # 中文：基于仓库根目录下的多阶段 Dockerfile 构建。
          file: ./Dockerfile
          # English: Select the target stage matching the image variant.
          # 中文：选择与镜像变体一致的 target 阶段。
          target: ${{ matrix.variant }}
          # English: Push the built image instead of only building it locally.
          # 中文：推送构建出的镜像，而不是只在本地构建。
          push: true
          # English: Publish tags such as base-v0.1.0/base-latest, dev-v0.1.0/dev-latest, and full-v0.1.0/full-latest.
          # 中文：发布 base-v0.1.0/base-latest、dev-v0.1.0/dev-latest、full-v0.1.0/full-latest 等 tag。
          tags: |
            zqbxdev/zero:${{ matrix.variant }}-${{ github.ref_name }}
            zqbxdev/zero:${{ matrix.variant }}-latest
