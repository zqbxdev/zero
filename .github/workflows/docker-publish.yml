# English: Build and push the Docker image to Docker Hub when a release Git tag is pushed.
# 中文：当推送发布用 Git tag 时，构建 Docker 镜像并推送到 Docker Hub。
name: Build and Push Docker Image

# English: This workflow only runs for tag pushes, not for normal branch pushes.
# 中文：该工作流只在推送 tag 时触发，不会在普通分支 push 时触发。
on:
  push:
    tags:
      # English: Stable semantic version tags, for example v1.0.0.
      # 中文：稳定版语义化版本 tag，例如 v1.0.0。
      - "v*.*.*"
      # English: Pre-release semantic version tags, for example v1.0.0-beta.1.
      # 中文：预发布语义化版本 tag，例如 v1.0.0-beta.1。
      - "v*.*.*-*"

# English: The workflow only needs read access to repository contents.
# 中文：该工作流只需要读取仓库内容的权限。
permissions:
  contents: read

jobs:
  docker:
    # English: Build the Docker image from Dockerfile and push it to Docker Hub.
    # 中文：基于 Dockerfile 构建 Docker 镜像，并推送到 Docker Hub。
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      # English: Check out the repository source code for Docker build context.
      # 中文：检出仓库源代码，作为 Docker 构建上下文。
      - name: Checkout repository
        uses: actions/checkout@v4

      # English: Enable Docker Buildx for modern Docker builds and caching support.
      # 中文：启用 Docker Buildx，用于现代 Docker 构建和缓存能力。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # English: Log in to Docker Hub using repository secrets.
      # 中文：使用仓库 secrets 登录 Docker Hub。
      # English: Required secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.
      # 中文：需要的 secrets：DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN。
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # English: Generate Docker image metadata and use the Git tag as the image tag.
      # 中文：生成 Docker 镜像元数据，并使用 Git tag 作为镜像 tag。
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # English: Target Docker Hub image repository.
          # 中文：目标 Docker Hub 镜像仓库。
          images: zqbxdev/zero
          tags: |
            # English: For tag v1.0.0, publish image tag zqbxdev/zero:v1.0.0.
            # 中文：例如 tag 为 v1.0.0 时，发布镜像 zqbxdev/zero:v1.0.0。
            type=ref,event=tag

      # English: Build the image from the root Dockerfile and push it to Docker Hub.
      # 中文：使用根目录 Dockerfile 构建镜像，并推送到 Docker Hub。
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # English: Use repository root as Docker build context.
          # 中文：使用仓库根目录作为 Docker 构建上下文。
          context: .
          # English: Build from the Dockerfile in the repository root.
          # 中文：基于仓库根目录下的 Dockerfile 构建。
          file: ./Dockerfile
          # English: Push the built image instead of only building it locally.
          # 中文：推送构建出的镜像，而不是只在本地构建。
          push: true
          # English: Use tags generated by docker/metadata-action.
          # 中文：使用 docker/metadata-action 生成的镜像 tag。
          tags: ${{ steps.meta.outputs.tags }}
          # English: Attach standard OCI labels generated by docker/metadata-action.
          # 中文：附加 docker/metadata-action 生成的标准 OCI labels。
          labels: ${{ steps.meta.outputs.labels }}
